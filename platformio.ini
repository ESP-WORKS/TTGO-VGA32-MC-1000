; MC-1000 (CCE) para TTGO VGA32 / ESP32 - projeto PlatformIO
; Convertido do sketch Arduino "ttgo-vga32-mc1000" v0.7
; Equivalente ao Compilar.bat original:
;   arduino-cli --fqbn esp32:esp32:esp32wrover  (PSRAM ativa)
;   + partitions.csv da pasta do sketch (compativel com o bootloader ESP-WORKS)

[platformio]
default_envs = ttgo-vga32

; Placa padrao: LilyGO TTGO VGA32 v1.4 (ESP32-PICO-D4 + PSRAM) / ROBGO_RG
[env:ttgo-vga32]
; Arduino-ESP32 2.0.17 (FabGL 1.0.9 NAO compila no core 3.x)
platform  = espressif32@6.9.0
framework = arduino
board     = esp32dev

board_build.f_cpu      = 240000000L
board_build.f_flash    = 80000000L
board_build.flash_mode = dio
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = partitions.csv

lib_deps =
    fdivitto/FabGL@1.0.9
; Os fontes incluem cabecalhos internos da FabGL ("devdrivers/soundgen.h",
; "dispdrivers/vga16controller.h"...) antes de "fabgl.h". Forca a pasta src
; da FabGL no include path do projeto, independente do LDF.
lib_ldf_mode = deep+

build_flags =
    -I.pio/libdeps/ttgo-vga32/FabGL/src
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=0
    ; Opcionais (descomente para ativar):
    ; -DMC1000_PERIODIC_HEALTH_LOG=1
    ; -DMC1000_USE_VGA16=0     ; volta ao backend VGA8 original

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder
upload_speed    = 921600